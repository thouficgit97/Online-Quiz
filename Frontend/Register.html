<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="register.css">
    <script src="register.js" defer></script>
</head>
<body>
    <form id = "form">
        <div id = "register-form-cred">
            <input type="text" placeholder="username" id = "uname"><br><br>

            <input type="password" placeholder="enter password" name="" id="pwd1"><br><br>
            <input type="password" placeholder="repeat password" id = "pwd2"><br><br>
        </div>
        <div id ="error-message">
            
        </div>
        <br>
        <div id = "register-form-buttons">
            <button type="button" onclick="clearForm()">Clear</button>
            <button type="button" onclick="register()">Register</button><br><br>
            <span>Already an User ?</span>
            <button type="button" onclick="redirectToLogin()">Login</button>
        </div>
    </form>
</body>
</html>
